[build-system]
requires = ["uv-build>=0.10.2,<0.12"]
build-backend = "uv_build"

[project]
name = "pb-spec"
version = "1.1.12"
description = "Plan-Build Spec (pb-spec): A CLI tool for managing AI coding assistant skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "Bob Liu", email = "akagi201@gmail.com" },
]
keywords = ["cli", "ai", "coding-assistant", "skills", "plan-build", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.4.2",
]

[project.urls]
Homepage = "https://github.com/longcipher/pb-spec"
Repository = "https://github.com/longcipher/pb-spec"
Issues = "https://github.com/longcipher/pb-spec/issues"

[project.scripts]
pb-spec = "pb_spec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "property: property-based tests powered by hypothesis",
    "mutation: tests guarding mutation-testing tooling",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mutmut]
# mutmut 3.x config schema: source_paths (list), pytest_add_cli_args,
# pytest_add_cli_args_test_selection. Incremental by default — cached verdicts are
# reused and only new/changed functions are re-tested (git change detection).
source_paths = ["src/pb_spec/"]
pytest_add_cli_args = ["-x", "--assert=plain"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.coverage.run]
source = ["pb_spec"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ty.environment]
python-version = "3.14"
