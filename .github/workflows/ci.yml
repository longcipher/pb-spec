name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v2
      - run: uv sync
      - run: just ci

  mutation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v2
      - run: uv sync
      - name: Incremental mutation gate (changed files vs base)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="origin/${{ github.ref_name }}"
          fi
          # checkout with fetch-depth: 0 already has all refs; fetch defensively.
          git fetch origin "$BASE_REF" || true
          # Exit 2 means "no changed files" — a skip, not a failure.
          ./scripts/run-mutation-diff.sh --against "$BASE_REF" || [ "$?" -eq 2 ]
