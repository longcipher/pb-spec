schema_version: v1alpha1

environment:
  type: none

engine:
  name: opencode
  model:
    provider: agentrouter
    name: deepseek-v4-flash

cases:
  files:
    - evals/cases/refine-float-exponent.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 20
    expect:
      exit_code: 0

  retry_policy:
    max_retries: 1
    retry_on: [timeout, error]

report:
  formats: [json, html]
  artifacts: [transcript]
